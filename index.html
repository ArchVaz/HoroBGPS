<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>放浪 Bike Computer</title>
  
  <!-- PWA & iOS Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="放浪">

  <!-- Leaflet GIS Map Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-black: #000000;
      --card-bg: #0c0c0c;
      --card-border: #1a1a1a;
      --text-white: #ffffff;
      --text-dim: #666666;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --accent-orange: #ff9f0a;
      --accent-blue: #0a84ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--text-white);
      line-height: 1;
      opacity: 0.9;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      font-size: 10px;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-dim);
    }

    .status-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .status-dot.auto-paused {
      background-color: var(--accent-orange);
      box-shadow: 0 0 8px var(--accent-orange);
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-white);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--text-white);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      margin: 16px 0 8px 0;
      text-transform: uppercase;
    }

    .gpx-download-btn {
      width: 100%;
      background: #181818;
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 12px;
    }

    .gpx-download-btn:active {
      background: rgba(48, 209, 88, 0.15);
    }

    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #121212;
      border-radius: 10px;
      border: 1px solid #1f1f1f;
      touch-action: none;
    }

    .toggle-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .order-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      padding: 2px 4px;
      cursor: pointer;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }

    .unit-selector {
      display: flex;
      background: #000;
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
    }

    .unit-opt {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      background: none;
      border: none;
    }

    .unit-opt.active {
      background: #222;
      color: var(--text-white);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2c2c2e;
      transition: .2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-green);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* History List Styling */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-item {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-white);
    }

    .history-meta {
      font-size: 11px;
      color: var(--text-dim);
    }

    .history-actions {
      display: flex;
      gap: 6px;
    }

    .hist-btn {
      background: #1c1c1e;
      border: 1px solid #333;
      color: var(--text-white);
      font-size: 10px;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .hist-btn.dl {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .hist-btn.del {
      border-color: #442222;
      color: var(--accent-red);
    }

    /* Dashboard Grid Container */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grid-row {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-1 { grid-template-columns: 1fr; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      width: 100%;
    }

    .card.hidden {
      display: none !important;
    }

    .primary-metric {
      text-align: center;
      padding: 18px 12px;
    }

    .metric-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .speed-value {
      font-size: 82px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
    }

    .unit-label {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
      margin-top: 4px;
    }

    .sub-metric {
      text-align: center;
      padding: 10px 4px;
    }

    .sub-value {
      font-size: 20px;
      font-weight: 700;
      margin-top: 2px;
    }

    .sub-value span {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .time-display {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    #map {
      width: 100%;
      height: 200px;
      min-height: 200px;
      border-radius: 10px;
      background: #000000;
      z-index: 1;
    }

    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }

    /* 4-Button Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      margin-top: auto;
      max-width: 400px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 14px 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:active {
      background-color: #1a1a1a;
    }

    .btn.active-start {
      border-color: var(--accent-green) !important;
      color: var(--accent-green) !important;
      background-color: rgba(48, 209, 88, 0.1) !important;
    }

    .btn.active-pause {
      border-color: var(--accent-orange) !important;
      color: var(--accent-orange) !important;
      background-color: rgba(255, 159, 10, 0.1) !important;
    }

    .btn.btn-reset {
      border-color: #333;
      color: var(--accent-red);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-text">放浪</div>
    <div class="header-actions">
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">READY</span>
      </div>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </div>

  <!-- Menu / Settings Modal -->
  <div id="menuModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">MENU</div>
        <button class="close-btn" onclick="toggleMenu()">✕</button>
      </div>

      <button class="gpx-download-btn" onclick="downloadCurrentGPX()">EXPORT CURRENT RIDE (GPX)</button>

      <div class="section-title">Ride History</div>
      <div id="historyContainer" class="history-list">
        <!-- History items rendered via JS -->
      </div>

      <div class="section-title">Dashboard Customization</div>
      <div class="toggle-list" id="reorderList">
        
        <div class="toggle-item" data-id="unit-setting">
          <span class="toggle-label">Speed Units</span>
          <div class="unit-selector">
            <button id="btnKm" class="unit-opt active" onclick="setUnits('metric')">KM/H</button>
            <button id="btnMi" class="unit-opt" onclick="setUnits('imperial')">MPH</button>
          </div>
        </div>

        <div class="toggle-item" data-card="card-speed">
          <div class="toggle-left">
            <button class="order-btn" onclick="moveTileUp(this)">▲</button>
            <button class="order-btn" onclick="moveTileDown(this)">▼</button>
            <span class="toggle-label">Speed</span>
          </div>
          <label class="switch"><input type="checkbox" id="chk-speed" checked onchange="updateLayout()"><span class="slider"></span></label>
        </div>

        <div class="toggle-item" data-card="row-stats">
          <div class="toggle-left">
            <button class="order-btn" onclick="moveTileUp(this)">▲</button>
            <button class="order-btn" onclick="moveTileDown(this)">▼</button>
            <span class="toggle-label">Distance / Avg / Max</span>
          </div>
          <label class="switch"><input type="checkbox" id="chk-stats" checked onchange="updateLayout()"><span class="slider"></span></label>
        </div>

        <div class="toggle-item" data-card="row-elevation">
          <div class="toggle-left">
            <button class="order-btn" onclick="moveTileUp(this)">▲</button>
            <button class="order-btn" onclick="moveTileDown(this)">▼</button>
            <span class="toggle-label">Elevation / Altitude</span>
          </div>
          <label class="switch"><input type="checkbox" id="chk-ele" checked onchange="updateLayout()"><span class="slider"></span></label>
        </div>

        <div class="toggle-item" data-card="card-time">
          <div class="toggle-left">
            <button class="order-btn" onclick="moveTileUp(this)">▲</button>
            <button class="order-btn" onclick="moveTileDown(this)">▼</button>
            <span class="toggle-label">Elapsed Time</span>
          </div>
          <label class="switch"><input type="checkbox" id="chk-time" checked onchange="updateLayout()"><span class="slider"></span></label>
        </div>

        <div class="toggle-item" data-card="card-map">
          <div class="toggle-left">
            <button class="order-btn" onclick="moveTileUp(this)">▲</button>
            <button class="order-btn" onclick="moveTileDown(this)">▼</button>
            <span class="toggle-label">GPS Map View</span>
          </div>
          <label class="switch"><input type="checkbox" id="chk-map" checked onchange="updateLayout()"><span class="slider"></span></label>
        </div>

      </div>
    </div>
  </div>

  <!-- Reorderable Dashboard Container -->
  <div class="dashboard-container" id="dashboard">
    
    <div id="card-speed" class="card primary-metric">
      <div class="metric-label">Current Speed</div>
      <div id="speedVal" class="speed-value">0.0</div>
      <div id="unitLabel" class="unit-label">KM/H</div>
    </div>

    <div id="row-stats" class="grid-row grid-3">
      <div id="card-dist" class="card sub-metric">
        <div class="metric-label">Distance</div>
        <div id="distVal" class="sub-value">0.00 <span>km</span></div>
      </div>
      <div id="card-avg" class="card sub-metric">
        <div class="metric-label">Avg Speed</div>
        <div id="avgSpeedVal" class="sub-value">0.0 <span>km/h</span></div>
      </div>
      <div id="card-max" class="card sub-metric">
        <div class="metric-label">Max Speed</div>
        <div id="maxSpeedVal" class="sub-value">0.0 <span>km/h</span></div>
      </div>
    </div>

    <div id="row-elevation" class="grid-row grid-2">
      <div id="card-ele" class="card sub-metric">
        <div class="metric-label">Elevation Gain</div>
        <div id="eleGainVal" class="sub-value">0 <span>m</span></div>
      </div>
      <div id="card-alt" class="card sub-metric">
        <div class="metric-label">Altitude</div>
        <div id="altVal" class="sub-value">-- <span>m</span></div>
      </div>
    </div>

    <div id="card-time" class="card sub-metric">
      <div class="metric-label">Elapsed Time</div>
      <div id="timerVal" class="time-display">00:00:00</div>
    </div>

    <div id="card-map" class="card" style="padding: 4px;">
      <div id="map"></div>
    </div>

  </div>

  <!-- Control Buttons Dock -->
  <div class="controls-grid">
    <button id="startBtn" class="btn" onclick="startRide()">START</button>
    <button id="pauseBtn" class="btn" onclick="pauseRide()">PAUSE</button>
    <button id="stopBtn" class="btn" onclick="stopRide()">STOP</button>
    <button id="resetBtn" class="btn btn-reset" onclick="resetRide()">RESET</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => {
        document.getElementById('statusText').innerText = 'OFFLINE READY';
      }).catch(() => {});
    }

    let isMetric = true;
    let rideState = 'STOPPED'; // STOPPED, RUNNING, PAUSED, AUTO_PAUSED
    let watchId = null;
    let wakeLock = null;

    let startTime = 0;
    let elapsedTime = 0;
    let movingTimeSecs = 0;
    let timerInterval = null;

    let totalDistanceMeters = 0;
    let maxSpeedMps = 0;
    let totalEleGain = 0;
    let lastPosition = null;

    let zeroSpeedCount = 0;
    let gpxTrackPoints = [];
    let rideHistory = [];
    let map, routePolyline, userMarker;

    window.onload = () => {
      loadLayoutPreferences();
      loadRideHistory();
      initMap();
    };

    function initMap() {
      if (typeof L === 'undefined') return;
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20, 0], 2);
      
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        maxZoom: 19,
        crossOrigin: true
      }).addTo(map);

      routePolyline = L.polyline([], { color: '#30d158', weight: 4 }).addTo(map);

      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 500);
    }

    function toggleMenu() {
      document.getElementById('menuModal').classList.toggle('active');
      renderHistoryList();
    }

    function setUnits(type) {
      isMetric = (type === 'metric');
      document.getElementById('btnKm').classList.toggle('active', isMetric);
      document.getElementById('btnMi').classList.toggle('active', !isMetric);
      document.getElementById('unitLabel').innerText = isMetric ? 'KM/H' : 'MPH';
      if (lastPosition) updateDisplay(lastPosition);
      renderHistoryList();
    }

    function moveTileUp(btn) {
      const item = btn.closest('.toggle-item');
      if (item.previousElementSibling && item.previousElementSibling.dataset.card) {
        item.parentNode.insertBefore(item, item.previousElementSibling);
        updateLayout();
      }
    }

    function moveTileDown(btn) {
      const item = btn.closest('.toggle-item');
      if (item.nextElementSibling) {
        item.parentNode.insertBefore(item.nextElementSibling, item);
        updateLayout();
      }
    }

    function updateLayout() {
      const dashboard = document.getElementById('dashboard');
      const toggleItems = document.querySelectorAll('#reorderList .toggle-item[data-card]');
      const cardOrder = [];

      toggleItems.forEach(item => {
        const cardId = item.dataset.card;
        cardOrder.push(cardId);
        
        const cardEl = document.getElementById(cardId);
        const checkbox = item.querySelector('input[type="checkbox"]');
        
        if (cardEl && checkbox) {
          if (checkbox.checked) cardEl.classList.remove('hidden');
          else cardEl.classList.add('hidden');
          dashboard.appendChild(cardEl);
        }
      });

      localStorage.setItem('horo_card_order', JSON.stringify(cardOrder));
      if (map) setTimeout(() => map.invalidateSize(), 200);
    }

    function loadLayoutPreferences() {
      const savedOrder = localStorage.getItem('horo_card_order');
      if (savedOrder) {
        const cardOrder = JSON.parse(savedOrder);
        const reorderList = document.getElementById('reorderList');
        
        cardOrder.forEach(cardId => {
          const toggleItem = document.querySelector(`.toggle-item[data-card="${cardId}"]`);
          if (toggleItem) reorderList.appendChild(toggleItem);
        });
      }
      updateLayout();
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
    });

    function startRide() {
      if (rideState === 'RUNNING') return;

      rideState = 'RUNNING';
      zeroSpeedCount = 0;
      requestWakeLock();

      document.getElementById('startBtn').classList.add('active-start');
      document.getElementById('pauseBtn').classList.remove('active-pause');
      document.getElementById('statusDot').className = 'status-dot active';
      document.getElementById('statusText').innerText = 'RECORDING';

      startTime = Date.now() - elapsedTime;
      if (!timerInterval) timerInterval = setInterval(updateTimer, 1000);

      if (!watchId && navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        });
      }
    }

    function pauseRide() {
      if (rideState === 'STOPPED') return;

      rideState = 'PAUSED';
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      document.getElementById('startBtn').classList.remove('active-start');
      document.getElementById('pauseBtn').classList.add('active-pause');
      document.getElementById('statusDot').className = 'status-dot';
      document.getElementById('statusText').innerText = 'PAUSED';
    }

    function autoPauseRide() {
      rideState = 'AUTO_PAUSED';
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      document.getElementById('startBtn').classList.remove('active-start');
      document.getElementById('pauseBtn').classList.add('active-pause');
      document.getElementById('statusDot').className = 'status-dot auto-paused';
      document.getElementById('statusText').innerText = 'AUTO-PAUSED';
    }

    function stopRide() {
      if (rideState === 'STOPPED') return;

      // Save ride to history if points exist
      if (gpxTrackPoints.length > 0) {
        saveCurrentRideToHistory();
      }

      rideState = 'STOPPED';
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      document.getElementById('startBtn').classList.remove('active-start');
      document.getElementById('pauseBtn').classList.remove('active-pause');
      document.getElementById('statusDot').className = 'status-dot';
      document.getElementById('statusText').innerText = 'STOPPED';
    }

    function resetRide() {
      if (confirm("Reset all ride data and start fresh?")) {
        if (rideState !== 'STOPPED') stopRide();

        elapsedTime = 0;
        movingTimeSecs = 0;
        totalDistanceMeters = 0;
        maxSpeedMps = 0;
        totalEleGain = 0;
        lastPosition = null;
        zeroSpeedCount = 0;
        gpxTrackPoints = [];

        document.getElementById('statusText').innerText = 'READY';
        document.getElementById('timerVal').innerText = "00:00:00";
        document.getElementById('speedVal').innerText = "0.0";
        document.getElementById('distVal').innerHTML = `0.00 <span>${isMetric ? 'km' : 'mi'}</span>`;
        document.getElementById('avgSpeedVal').innerHTML = `0.0 <span>${isMetric ? 'km/h' : 'mph'}</span>`;
        document.getElementById('maxSpeedVal').innerHTML = `0.0 <span>${isMetric ? 'km/h' : 'mph'}</span>`;
        document.getElementById('eleGainVal').innerHTML = `0 <span>${isMetric ? 'm' : 'ft'}</span>`;
        document.getElementById('altVal').innerHTML = `-- <span>${isMetric ? 'm' : 'ft'}</span>`;

        if (routePolyline) routePolyline.setLatLngs([]);
      }
    }

    function handlePosition(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const alt = pos.coords.altitude || 0;
      const rawSpeed = pos.coords.speed || 0;
      const accuracy = pos.coords.accuracy || 0;
      const timestamp = new Date(pos.timestamp || Date.now()).toISOString();

      if (accuracy > 25) return;

      const latLng = [lat, lon];

      if (map) {
        if (!userMarker) {
          userMarker = L.circleMarker(latLng, { radius: 6, color: '#30d158', fillColor: '#30d158', fillOpacity: 1 }).addTo(map);
          map.setView(latLng, 16);
        } else {
          userMarker.setLatLng(latLng);
          map.panTo(latLng);
        }
      }

      // Speed thresholding for Auto-Pause/Resume
      const speedKmH = rawSpeed * 3.6;
      const isMoving = speedKmH >= 1.2;

      if (rideState === 'RUNNING') {
        if (!isMoving) {
          zeroSpeedCount++;
          if (zeroSpeedCount >= 3) {
            autoPauseRide();
            return;
          }
        } else {
          zeroSpeedCount = 0;
        }
      } else if (rideState === 'AUTO_PAUSED' && isMoving) {
        startRide();
      }

      // Block recording if paused or stopped
      if (rideState !== 'RUNNING') {
        if (lastPosition) updateDisplay({ ...lastPosition, speed: 0 });
        return;
      }

      const filteredSpeed = rawSpeed < 0.33 ? 0 : rawSpeed;
      if (filteredSpeed > 0) movingTimeSecs++;

      if (lastPosition) {
        const d = calcDistance(lastPosition.latitude, lastPosition.longitude, lat, lon);

        if (d > 2.5 && filteredSpeed > 0) {
          totalDistanceMeters += d;
          if (routePolyline) routePolyline.addLatLng(latLng);
          gpxTrackPoints.push({ lat, lon, alt, speed: filteredSpeed, time: timestamp });

          if (alt !== null && lastPosition.altitude !== null) {
            const eleDiff = alt - lastPosition.altitude;
            if (eleDiff > 2.0) totalEleGain += eleDiff;
          }
        }
      } else {
        gpxTrackPoints.push({ lat, lon, alt, speed: filteredSpeed, time: timestamp });
      }

      if (filteredSpeed > maxSpeedMps) maxSpeedMps = filteredSpeed;

      lastPosition = { latitude: lat, longitude: lon, altitude: alt, speed: filteredSpeed };
      updateDisplay(lastPosition);
    }

    function updateDisplay(pos) {
      const currSpeed = isMetric ? (pos.speed * 3.6) : (pos.speed * 2.23694);
      const maxSpeed = isMetric ? (maxSpeedMps * 3.6) : (maxSpeedMps * 2.23694);
      const distance = isMetric ? (totalDistanceMeters / 1000) : (totalDistanceMeters / 1609.34);
      
      const avgSpeedMps = movingTimeSecs > 0 ? (totalDistanceMeters / movingTimeSecs) : 0;
      const avgSpeed = isMetric ? (avgSpeedMps * 3.6) : (avgSpeedMps * 2.23694);
      
      const eleGain = isMetric ? totalEleGain : totalEleGain * 3.28084;
      const altitude = pos.altitude !== null ? (isMetric ? pos.altitude : pos.altitude * 3.28084) : '--';

      document.getElementById('speedVal').innerText = currSpeed.toFixed(1);
      document.getElementById('distVal').innerHTML = `${distance.toFixed(2)} <span>${isMetric ? 'km' : 'mi'}</span>`;
      document.getElementById('avgSpeedVal').innerHTML = `${avgSpeed.toFixed(1)} <span>${isMetric ? 'km/h' : 'mph'}</span>`;
      document.getElementById('maxSpeedVal').innerHTML = `${maxSpeed.toFixed(1)} <span>${isMetric ? 'km/h' : 'mph'}</span>`;
      document.getElementById('eleGainVal').innerHTML = `${Math.round(eleGain)} <span>${isMetric ? 'm' : 'ft'}</span>`;
      document.getElementById('altVal').innerHTML = `${altitude !== '--' ? Math.round(altitude) : '--'} <span>${isMetric ? 'm' : 'ft'}</span>`;
    }

    function updateTimer() {
      elapsedTime = Date.now() - startTime;
      const totalSecs = Math.floor(elapsedTime / 1000);
      const hrs = Math.floor(totalSecs / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;

      document.getElementById('timerVal').innerText =
        `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    /* Ride History Management */
    function saveCurrentRideToHistory() {
      const dateIso = new Date().toISOString();
      const dateFormatted = new Date().toLocaleDateString();
      const avgSpeedMps = movingTimeSecs > 0 ? (totalDistanceMeters / movingTimeSecs) : 0;

      const record = {
        id: Date.now(),
        date: dateFormatted,
        isoDate: dateIso.split('T')[0],
        distanceMeters: totalDistanceMeters,
        movingSecs: movingTimeSecs,
        avgSpeedMps: avgSpeedMps,
        trackPoints: [...gpxTrackPoints]
      };

      rideHistory.unshift(record);
      localStorage.setItem('horo_ride_history', JSON.stringify(rideHistory));
    }

    function loadRideHistory() {
      const saved = localStorage.getItem('horo_ride_history');
      if (saved) {
        try { rideHistory = JSON.parse(saved); } catch (e) { rideHistory = []; }
      }
    }

    function renderHistoryList() {
      const container = document.getElementById('historyContainer');
      if (rideHistory.length === 0) {
        container.innerHTML = `<div style="font-size:11px; color:var(--text-dim); padding:8px 0;">No saved rides found.</div>`;
        return;
      }

      container.innerHTML = rideHistory.map(item => {
        const dist = isMetric ? (item.distanceMeters / 1000).toFixed(2) + ' km' : (item.distanceMeters / 1609.34).toFixed(2) + ' mi';
        const avg = isMetric ? (item.avgSpeedMps * 3.6).toFixed(1) + ' km/h' : (item.avgSpeedMps * 2.23694).toFixed(1) + ' mph';
        
        return `
          <div class="history-item">
            <div class="history-info">
              <div class="history-date">${item.date}</div>
              <div class="history-meta">${dist} • ${avg} avg</div>
            </div>
            <div class="history-actions">
              <button class="hist-btn dl" onclick="exportHistoryGPX(${item.id})">GPX</button>
              <button class="hist-btn del" onclick="deleteHistoryItem(${item.id})">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function deleteHistoryItem(id) {
      rideHistory = rideHistory.filter(item => item.id !== id);
      localStorage.setItem('horo_ride_history', JSON.stringify(rideHistory));
      renderHistoryList();
    }

    function exportHistoryGPX(id) {
      const ride = rideHistory.find(item => item.id === id);
      if (ride) exportGPXFile(ride.trackPoints, ride.isoDate);
    }

    function downloadCurrentGPX() {
      if (gpxTrackPoints.length === 0) {
        alert("No current ride track recorded.");
        return;
      }
      const today = new Date().toISOString().split('T')[0];
      exportGPXFile(gpxTrackPoints, today);
    }

    function exportGPXFile(trackPoints, dateStr) {
      const filename = `HoroGPS_${dateStr}.gpx`;

      let gpxXml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      gpxXml += `<gpx version="1.1" creator="放浪 Bike Computer" xmlns="http://www.topografix.com/GPX/1/1">\n`;
      gpxXml += `  <metadata>\n`;
      gpxXml += `    <name>${filename}</name>\n`;
      gpxXml += `    <time>${new Date().toISOString()}</time>\n`;
      gpxXml += `  </metadata>\n`;
      gpxXml += `  <trk>\n`;
      gpxXml += `    <name>放浪 Ride - ${dateStr}</name>\n`;
      gpxXml += `    <trkseg>\n`;

      trackPoints.forEach(pt => {
        gpxXml += `      <trkpt lat="${pt.lat}" lon="${pt.lon}">\n`;
        gpxXml += `        <ele>${pt.alt.toFixed(1)}</ele>\n`;
        gpxXml += `        <time>${pt.time}</time>\n`;
        gpxXml += `      </trkpt>\n`;
      });

      gpxXml += `    </trkseg>\n`;
      gpxXml += `  </trk>\n`;
      gpxXml += `</gpx>`;

      const blob = new Blob([gpxXml], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function handleError(err) {
      document.getElementById('statusText').innerText = 'SEARCHING GPS';
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>放浪</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="放浪">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-black: #000000;
      --card-bg: #000000;
      --border-subtle: #1a1a1a;
      --text-white: #ffffff;
      --text-dim: #666666;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --accent-orange: #ff9f0a;
    }

    body.theme-sun {
      --border-subtle: #333333;
      --text-dim: #a0a0a0;
      --accent-green: #00ff66;
      --accent-orange: #ffcc00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    .logo-img {
      height: 22px;
      width: auto;
      object-fit: contain;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-size: 10px;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-dim);
    }

    .status-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-white);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .toast-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #111111;
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      z-index: 10000;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      pointer-events: none;
    }

    .toast-notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Modal Overlay & Fixed Height Structure */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex !important;
    }

    .modal-content {
      background: var(--bg-black);
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      height: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
    }

    .menu-tabs {
      display: flex;
      background: #0a0a0a;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #181818;
      color: var(--text-white);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .tab-content.active {
      display: flex;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #0a0a0a;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 600;
    }

    .unit-selector {
      display: flex;
      background: #000;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
    }

    .unit-opt {
      padding: 5px 8px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      background: none;
      border: none;
    }

    .unit-opt.active {
      background: #222;
      color: var(--text-white);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2c2c2e;
      border-radius: 20px;
      transition: .2s;
    }

    .slider:before {
      position: absolute; content: "";
      height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; border-radius: 50%; transition: .2s;
    }

    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider:before { transform: translateX(18px); }

    .history-item {
      background: #0a0a0a;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-date {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .history-stats {
      font-size: 12px;
      font-weight: 700;
    }

    .history-actions {
      display: flex;
      gap: 6px;
    }

    .history-btn {
      background: #181818;
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      padding: 5px 8px;
      font-size: 9px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }

    .history-btn.gpx-btn {
      color: var(--accent-green);
      border-color: rgba(48, 209, 88, 0.3);
    }

    /* Main Responsive Layout */
    .dashboard-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    .grid-row {
      display: grid;
      gap: 6px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-1 { grid-template-columns: 1fr; }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 6px 8px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    .card.hidden { display: none !important; }

    .primary-metric {
      flex: 1.2;
      max-height: 22vh;
      min-height: 85px;
      padding: 4px 8px;
      justify-content: center;
      transition: max-height 0.2s ease, flex 0.2s ease;
    }

    .speed-value {
      font-size: 72px;
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -2px;
    }

    body.map-disabled .primary-metric {
      flex: 1.8;
      max-height: 30vh;
    }

    body.theme-sun .speed-value { color: var(--accent-green); }

    .metric-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .unit-label {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      margin-top: 1px;
    }

    .sub-metric {
      text-align: center;
      padding: 4px 2px;
      flex: 1;
    }

    .sub-value {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
    }

    .sub-value span {
      font-size: 10px;
      color: var(--text-dim);
    }

    .card-time-container {
      flex: 0.8;
      min-height: 48px;
    }

    .time-display {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      line-height: 1;
    }

    #card-map {
      flex: 1.5;
      min-height: 100px;
      padding: 2px;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: #000000;
    }

    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .btn {
      position: relative;
      background-color: #0c0c0c;
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      padding: 12px 0;
      font-size: 10px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      overflow: hidden;
    }

    .btn.active-start {
      border-color: var(--accent-green) !important;
      color: var(--accent-green) !important;
      background-color: rgba(48, 209, 88, 0.1) !important;
    }

    .btn.active-pause {
      border-color: var(--accent-orange) !important;
      color: var(--accent-orange) !important;
      background-color: rgba(255, 159, 10, 0

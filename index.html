<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="放浪 Hōrō">
    <title>放浪 (Hōrō) Cycling Computer</title>

    <!-- Leaflet CSS for Dark GPS Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js for Elevation Profile -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.4);
            --accent-amber: #f59e0b;
            --accent-amber-glow: rgba(245, 158, 11, 0.4);
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-primary: #f3f4f6;
            --text-muted: #9ca3af;
            --radius-main: 18px;
            --font-mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
            transition: background 0.3s ease;
        }

        .status-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green-glow);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        /* MAIN DASHBOARD CONTENT */
        main {
            flex: 1;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 110px; /* Space for dock */
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-main);
            padding: 14px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        /* SPEED HERO CARD */
        .speed-card {
            align-items: center;
            justify-content: center;
            padding: 24px 14px;
            text-align: center;
            background: linear-gradient(180deg, rgba(22,28,45,0.85) 0%, rgba(15,20,35,0.95) 100%);
        }

        .speed-value {
            font-size: 4.8rem;
            font-weight: 900;
            line-height: 1;
            font-family: var(--font-mono);
            letter-spacing: -2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .speed-unit {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 600;
        }

        /* MULTI-COLUMN GRID LAYOUTS */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-metric {
            text-align: center;
            padding: 12px 6px;
        }

        .grid-metric .value {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-top: 4px;
        }

        .grid-metric .unit {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* MAP & CHART CONTAINERS */
        #map-container {
            height: 220px;
            border-radius: var(--radius-main);
            overflow: hidden;
            border: 1px solid var(--card-border);
            z-index: 1;
        }

        #elevation-chart-container {
            height: 120px;
            position: relative;
        }

        /* CONTROLS DOCK AT BOTTOM */
        .controls-dock {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 28px);
            max-width: 480px;
            background: rgba(15, 20, 32, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            z-index: 200;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 14px 0;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        /* BTN STATES */
        .control-btn.active-start {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 16px var(--accent-green-glow);
            border-color: var(--accent-green);
        }

        .control-btn.active-pause {
            background: var(--accent-amber);
            color: #000;
            box-shadow: 0 0 16px var(--accent-amber-glow);
            border-color: var(--accent-amber);
        }

        /* STOP HOLD OVERLAY */
        #stopBtn {
            position: relative;
        }

        .hold-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(239, 68, 68, 0.85);
            transition: height 0.05s linear;
            z-index: 1;
        }

        .btn-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TOAST NOTIFICATION */
        .toast-notification {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* MODAL POPUPS */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 900;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(20, 26, 40, 0.95);
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 28px 28px 0 0;
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* RIDE HISTORY LIST */
        .ride-history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ride-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ride-item-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .ride-item-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .ride-stat-val {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .ride-stat-lbl {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .ride-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-sm {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn-sm.btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .empty-history {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <span class="logo-title">放浪 HŌRŌ</span>
            <div class="status-badge">
                <div class="status-dot" id="gpsDot"></div>
                <span id="gpsStatusText">GPS OFF</span>
            </div>
        </div>
        <button class="btn-icon" id="menuBtn">☰</button>
    </header>

    <main>
        <!-- SPEED HERO DISPLAY -->
        <div class="metric-card speed-card">
            <span class="card-label">CURRENT SPEED</span>
            <div class="speed-value" id="valSpeed">0.0</div>
            <span class="speed-unit">KM / H</span>
        </div>

        <!-- 3-COLUMN METRICS GRID (Distance, Avg Speed, Max Speed) -->
        <div class="grid-3">
            <div class="metric-card grid-metric">
                <span class="card-label">DISTANCE</span>
                <div class="value" id="valDistance">0.00</div>
                <span class="unit">KM</span>
            </div>
            <div class="metric-card grid-metric">
                <span class="card-label">AVG SPEED</span>
                <div class="value" id="valAvgSpeed">0.0</div>
                <span class="unit">KM/H</span>
            </div>
            <div class="metric-card grid-metric">
                <span class="card-label">MAX SPEED</span>
                <div class="value" id="valMaxSpeed">0.0</div>
                <span class="unit">KM/H</span>
            </div>
        </div>

        <!-- 3-COLUMN METRICS GRID (Grade, Elevation Gain, Altitude) -->
        <div class="grid-3">
            <div class="metric-card grid-metric">
                <span class="card-label">GRADE</span>
                <div class="value" id="valGrade">0</div>
                <span class="unit">%</span>
            </div>
            <div class="metric-card grid-metric">
                <span class="card-label">ELEV GAIN</span>
                <div class="value" id="valElevGain">0</div>
                <span class="unit">M</span>
            </div>
            <div class="metric-card grid-metric">
                <span class="card-label">ALTITUDE</span>
                <div class="value" id="valAltitude">0</div>
                <span class="unit">M</span>
            </div>
        </div>

        <!-- ELAPSED TIME CARD -->
        <div class="metric-card">
            <span class="card-label">ELAPSED TIME</span>
            <div style="font-size: 2rem; font-weight: 800; font-family: var(--font-mono); text-align: center;" id="valTime">00:00:00</div>
        </div>

        <!-- ELEVATION PROFILE CHART CARD -->
        <div class="metric-card">
            <span class="card-label">ELEVATION PROFILE</span>
            <div id="elevation-chart-container">
                <canvas id="elevationChart"></canvas>
            </div>
        </div>

        <!-- GPS MAP CONTAINER -->
        <div class="metric-card" style="padding: 0;">
            <div id="map-container"></div>
        </div>
    </main>

    <div class="controls-dock">
        <button class="control-btn" id="startBtn">
            <div class="btn-content">
                <span style="font-size: 1.1rem;">▶</span>
                <span>START</span>
            </div>
        </button>
        <button class="control-btn" id="pauseBtn">
            <div class="btn-content">
                <span style="font-size: 1.1rem;">❚❚</span>
                <span>PAUSE</span>
            </div>
        </button>
        <button class="control-btn" id="stopBtn">
            <div class="hold-overlay" id="stopOverlay"></div>
            <div class="btn-content">
                <span style="font-size: 1.1rem;">■</span>
                <span>STOP</span>
            </div>
        </button>
        <button class="control-btn" id="resetBtn">
            <div class="btn-content">
                <span style="font-size: 1.1rem;">↺</span>
                <span>RESET</span>
            </div>
        </button>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast-notification" id="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Ride Saved</span>
    </div>

    <div class="modal" id="menuModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Ride History & Settings</span>
                <button class="btn-icon" id="closeMenuBtn">✕</button>
            </div>
            
            <div class="ride-history-list" id="rideHistoryContainer">
                <!-- Past rides injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // APP STATE & CONSTANTS
        const STATE = {
            IDLE: 'IDLE',
            RUNNING: 'RUNNING',
            PAUSED: 'PAUSED'
        };

        let currentState = STATE.IDLE;
        let watchId = null;
        let autoPauseTriggered = false;

        // SESSION METRICS
        let distanceMeters = 0;
        let maxSpeedKmh = 0;
        let currentSpeedKmh = 0;
        let totalElevationGain = 0;
        let currentAltitude = 0;
        let currentGrade = 0;
        let elapsedSeconds = 0;
        let timerInterval = null;

        // GPS TRACKING
        let trackPoints = []; // Array of { lat, lng, ele, time, speed }
        let lastPosition = null;

        // STORAGE KEYS
        const STORAGE_KEY = 'horo_ride_history';

        // DOM ELEMENTS
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const stopOverlay = document.getElementById('stopOverlay');
        const resetBtn = document.getElementById('resetBtn');
        const gpsDot = document.getElementById('gpsDot');
        const gpsStatusText = document.getElementById('gpsStatusText');
        const toast = document.getElementById('toast');
        const menuBtn = document.getElementById('menuBtn');
        const menuModal = document.getElementById('menuModal');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const rideHistoryContainer = document.getElementById('rideHistoryContainer');

        // MAP & CHART INITIALIZATION
        let map, trackPolyline, currentMarker;
        let elevationChart;

        function initMap() {
            // Default center (Osaka/Tokyo or initial fallback)
            map = L.map('map-container', {
                zoomControl: false,
                attributionControl: false
            }).setView([35.6762, 139.6503], 15);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            trackPolyline = L.polyline([], { color: '#10b981', weight: 4, opacity: 0.9 }).addTo(map);
        }

        function initChart() {
            const ctx = document.getElementById('elevationChart').getContext('2d');
            elevationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        borderColor: '#10b981',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.3,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { 
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#9ca3af', font: { size: 9 } }
                        }
                    }
                }
            });
        }

        function updateUIState() {
            // Remove active highlights
            startBtn.classList.remove('active-start');
            pauseBtn.classList.remove('active-pause');

            if (currentState === STATE.RUNNING) {
                startBtn.classList.add('active-start');
            } else if (currentState === STATE.PAUSED) {
                pauseBtn.classList.add('active-pause');
            }
        }

        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function showToast(message = "Ride Saved") {
            toast.querySelector('span').innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function handlePositionUpdate(pos) {
            const { latitude, longitude, altitude, speed } = pos.coords;
            const now = new Date();

            gpsDot.classList.add('active');
            gpsStatusText.innerText = 'GPS READY';

            // Convert speed m/s to km/h
            const speedKmh = speed ? (speed * 3.6) : 0;
            currentSpeedKmh = speedKmh > 0.8 ? speedKmh : 0;
            document.getElementById('valSpeed').innerText = currentSpeedKmh.toFixed(1);

            if (currentSpeedKmh > maxSpeedKmh) {
                maxSpeedKmh = currentSpeedKmh;
                document.getElementById('valMaxSpeed').innerText = maxSpeedKmh.toFixed(1);
            }

            // AUTO-PAUSE LOGIC (If moving under 1.5 km/h while running)
            if (currentState === STATE.RUNNING && currentSpeedKmh < 1.0) {
                autoPauseTriggered = true;
                currentState = STATE.PAUSED;
                updateUIState();
            } else if (currentState === STATE.PAUSED && autoPauseTriggered && currentSpeedKmh >= 2.5) {
                autoPauseTriggered = false;
                currentState = STATE.RUNNING;
                updateUIState();
            }

            if (currentState !== STATE.RUNNING) return;

            // Update Map Marker
            const latLng = [latitude, longitude];
            if (!currentMarker) {
                currentMarker = L.circleMarker(latLng, { radius: 6, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 1 }).addTo(map);
                map.setView(latLng, 16);
            } else {
                currentMarker.setLatLng(latLng);
            }

            // Calculate Distance & Elevation
            if (lastPosition) {
                const dist = calculateDistance(lastPosition.latitude, lastPosition.longitude, latitude, longitude);
                if (dist > 2) { // Minimum 2 meter movement threshold
                    distanceMeters += dist;
                    document.getElementById('valDistance').innerText = (distanceMeters / 1000).toFixed(2);

                    trackPolyline.addLatLng(latLng);
                    map.panTo(latLng);

                    // Elevation
                    if (altitude !== null) {
                        currentAltitude = Math.round(altitude);
                        document.getElementById('valAltitude').innerText = currentAltitude;
                        const eleDiff = altitude - lastPosition.altitude;
                        if (eleDiff > 0.5) {
                            totalElevationGain += eleDiff;
                            document.getElementById('valElevGain').innerText = Math.round(totalElevationGain);
                        }
                        // Grade calculation
                        currentGrade = Math.min(Math.max(Math.round((eleDiff / dist) * 100), -30), 30);
                        document.getElementById('valGrade').innerText = currentGrade;

                        // Chart update
                        elevationChart.data.labels.push('');
                        elevationChart.data.datasets[0].data.push(currentAltitude);
                        elevationChart.update();
                    }
                }
            }

            // Update Avg Speed
            if (elapsedSeconds > 0) {
                const avg = (distanceMeters / 1000) / (elapsedSeconds / 3600);
                document.getElementById('valAvgSpeed').innerText = avg.toFixed(1);
            }

            lastPosition = { latitude, longitude, altitude };
            trackPoints.push({ lat: latitude, lng: longitude, ele: altitude || 0, time: now.toISOString() });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function startSession() {
            if (currentState === STATE.RUNNING) return;
            currentState = STATE.RUNNING;
            autoPauseTriggered = false;
            updateUIState();

            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    if (currentState === STATE.RUNNING) {
                        elapsedSeconds++;
                        document.getElementById('valTime').innerText = formatTime(elapsedSeconds);
                    }
                }, 1000);
            }

            if (!watchId && navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(handlePositionUpdate, null, {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 10000
                });
            }
        }

        function pauseSession() {
            if (currentState === STATE.IDLE) return;
            currentState = STATE.PAUSED;
            autoPauseTriggered = false;
            updateUIState();
        }

        let stopHoldTimer = null;
        let stopProgress = 0;
        let stopInterval = null;

        function startStopHold() {
            if (currentState === STATE.IDLE && distanceMeters === 0) return;

            stopProgress = 0;
            stopInterval = setInterval(() => {
                stopProgress += 5;
                stopOverlay.style.height = `${stopProgress}%`;
                if (stopProgress >= 100) {
                    clearInterval(stopInterval);
                    executeStop();
                }
            }, 100);
        }

        function cancelStopHold() {
            if (stopInterval) clearInterval(stopInterval);
            stopProgress = 0;
            stopOverlay.style.height = '0%';
        }

        function executeStop() {
            cancelStopHold();
            saveRideToHistory();

            currentState = STATE.IDLE;
            updateUIState();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            showToast("Ride Saved");
        }

        function resetSession() {
            currentState = STATE.IDLE;
            updateUIState();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;

            distanceMeters = 0;
            maxSpeedKmh = 0;
            currentSpeedKmh = 0;
            totalElevationGain = 0;
            currentAltitude = 0;
            currentGrade = 0;
            elapsedSeconds = 0;
            trackPoints = [];
            lastPosition = null;

            document.getElementById('valSpeed').innerText = '0.0';
            document.getElementById('valDistance').innerText = '0.00';
            document.getElementById('valAvgSpeed').innerText = '0.0';
            document.getElementById('valMaxSpeed').innerText = '0.0';
            document.getElementById('valGrade').innerText = '0';
            document.getElementById('valElevGain').innerText = '0';
            document.getElementById('valAltitude').innerText = '0';
            document.getElementById('valTime').innerText = '00:00:00';

            if (trackPolyline) trackPolyline.setLatLngs([]);
            if (elevationChart) {
                elevationChart.data.labels = [];
                elevationChart.data.datasets[0].data = [];
                elevationChart.update();
            }
        }

        function saveRideToHistory() {
            if (distanceMeters < 10) return; // Don't save empty/tiny rides

            const rideRecord = {
                id: Date.now(),
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                distance: (distanceMeters / 1000).toFixed(2),
                avgSpeed: elapsedSeconds > 0 ? ((distanceMeters / 1000) / (elapsedSeconds / 3600)).toFixed(1) : '0.0',
                duration: formatTime(elapsedSeconds),
                elevation: Math.round(totalElevationGain),
                trackPoints: [...trackPoints]
            };

            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            history.unshift(rideRecord);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderRideHistory();
        }

        function renderRideHistory() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (history.length === 0) {
                rideHistoryContainer.innerHTML = `<div class="empty-history">No saved rides found. Finish a ride to automatically save it here.</div>`;
                return;
            }

            rideHistoryContainer.innerHTML = history.map(ride => `
                <div class="ride-item">
                    <div class="ride-item-header">
                        <span>${ride.date}</span>
                    </div>
                    <div class="ride-item-stats">
                        <div>
                            <div class="ride-stat-val">${ride.distance}</div>
                            <div class="ride-stat-lbl">KM</div>
                        </div>
                        <div>
                            <div class="ride-stat-val">${ride.avgSpeed}</div>
                            <div class="ride-stat-lbl">KM/H AVG</div>
                        </div>
                        <div>
                            <div class="ride-stat-val">${ride.duration}</div>
                            <div class="ride-stat-lbl">TIME</div>
                        </div>
                    </div>
                    <div class="ride-actions">
                        <button class="btn-sm" onclick="exportRideGPX(${ride.id})">Export GPX</button>
                        <button class="btn-sm btn-danger" onclick="deleteRide(${ride.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        window.deleteRide = function(id) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            history = history.filter(r => r.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderRideHistory();
        };

        window.exportRideGPX = function(id) {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const ride = history.find(r => r.id === id);
            if (!ride) return;

            const gpxHeader = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Hōrō Cycling Computer" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>Hōrō Ride - ${ride.date}</name>
    <trkseg>`;

            const gpxPoints = (ride.trackPoints || []).map(p => `
      <trkpt lat="${p.lat}" lon="${p.lng}">
        <ele>${p.ele}</ele>
        <time>${p.time}</time>
      </trkpt>`).join('');

            const gpxFooter = `
    </trkseg>
  </trk>
</gpx>`;

            const blob = new Blob([gpxHeader + gpxPoints + gpxFooter], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const dateStr = new Date(ride.id).toISOString().split('T')[0];
            a.download = `HoroGPS_${dateStr}.gpx`;
            a.click();
            URL.revokeObjectURL(url);
        };

        startBtn.addEventListener('click', startSession);
        pauseBtn.addEventListener('click', pauseSession);

        // STOP HOLD EVENTS
        stopBtn.addEventListener('mousedown', startStopHold);
        stopBtn.addEventListener('mouseup', cancelStopHold);
        stopBtn.addEventListener('mouseleave', cancelStopHold);
        stopBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startStopHold(); });
        stopBtn.addEventListener('touchend', cancelStopHold);

        resetBtn.addEventListener('click', () => {
            if (confirm("Reset current ride stats?")) resetSession();
        });

        menuBtn.addEventListener('click', () => {
            renderRideHistory();
            menuModal.classList.add('active');
        });

        closeMenuBtn.addEventListener('click', () => {
            menuModal.classList.remove('active');
        });

        // Initialize Map & Chart on Load
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            initChart();
            renderRideHistory();

            // Register Service Worker if present
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        });
    </script>
</body>
</html>
